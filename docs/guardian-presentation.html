&lt;h1&gt;Software Supply Chain Guardian: architecture&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;Deterministic evidence first. AI only explains and infers, behind guardrails. Nothing changes without a named human approval; the Guardian never merges or deploys.&lt;/div&gt;

&lt;div class=&quot;lbl&quot; style=&quot;left:48px;top:118px&quot;&gt;inputs (pinned commit)&lt;/div&gt;
&lt;div class=&quot;lbl&quot; style=&quot;left:358px;top:118px&quot;&gt;see &amp;amp; detect&lt;/div&gt;
&lt;div class=&quot;lbl&quot; style=&quot;left:668px;top:118px&quot;&gt;reason&lt;/div&gt;
&lt;div class=&quot;lbl&quot; style=&quot;left:978px;top:118px&quot;&gt;decide&lt;/div&gt;
&lt;div class=&quot;lbl&quot; style=&quot;left:1288px;top:118px&quot;&gt;prove &amp;amp; report&lt;/div&gt;

&lt;div class=&quot;box data&quot; style=&quot;left:48px;top:140px;width:270px;height:80px&quot;&gt;&lt;b&gt;Git repository&lt;/b&gt;remote · branch · commit SHA · clean-tree check&lt;/div&gt;
&lt;div class=&quot;box data&quot; style=&quot;left:48px;top:232px;width:270px;height:80px&quot;&gt;&lt;b&gt;Manifests &amp;amp; lockfiles&lt;/b&gt;package.json + lock (root, frontend) · pom.xml · requirements.txt&lt;/div&gt;
&lt;div class=&quot;box data&quot; style=&quot;left:48px;top:324px;width:270px;height:80px&quot;&gt;&lt;b&gt;Build &amp;amp; CI files&lt;/b&gt;Dockerfiles · docker-compose · GitHub Actions workflows&lt;/div&gt;
&lt;div class=&quot;box data&quot; style=&quot;left:48px;top:416px;width:270px;height:80px;border-style:dashed&quot;&gt;&lt;b&gt;External SBOMs (optional)&lt;/b&gt;syft image SBOM · CycloneDX · SPDX&lt;/div&gt;

&lt;div class=&quot;box agent&quot; style=&quot;left:358px;top:140px;width:270px;height:130px&quot;&gt;&lt;b&gt;1 · Discover&lt;/b&gt;Components with exact versions, direct + transitive, scope (prod / dev / CI)&lt;br&gt;→ CycloneDX 1.5 SBOM, dependency graph, path to every package, provenance&lt;/div&gt;
&lt;div class=&quot;box agent&quot; style=&quot;left:358px;top:310px;width:270px;height:186px&quot;&gt;&lt;b&gt;2 · Detect&lt;/b&gt;Known CVEs + malicious packages&lt;br&gt;Typosquats · unexpected / orphan deps&lt;br&gt;Install scripts (actual script text)&lt;br&gt;Lockfile tampering vs baseline + registry&lt;br&gt;Untrusted / mutable images · CI pinning&lt;br&gt;→ findings with evidence + initial severity&lt;/div&gt;

&lt;div class=&quot;box agent&quot; style=&quot;left:668px;top:140px;width:270px;height:130px&quot;&gt;&lt;b&gt;3 · Analyze&lt;/b&gt;Reachability from a source import scan · exposure (server / browser / install-time / CI) · production use · CVSS exploitability&lt;br&gt;→ explainable score 0-100, P1-P4, confidence&lt;/div&gt;
&lt;div class=&quot;box agent&quot; style=&quot;left:668px;top:310px;width:270px;height:186px&quot;&gt;&lt;b&gt;Investigator&lt;/b&gt;Deep-dive on one non-CVE risk:&lt;br&gt;baseline vs current lockfile + manifest, registry provenance &amp;amp; publish data, install-script text, what a CI ref resolves to, git history&lt;br&gt;→ &lt;u&gt;verified facts&lt;/u&gt; kept apart from &lt;u&gt;inference&lt;/u&gt;&lt;/div&gt;

&lt;div class=&quot;box agent&quot; style=&quot;left:978px;top:140px;width:270px;height:130px&quot;&gt;&lt;b&gt;4 · Remediation planner&lt;/b&gt;Options per risk: upgrade · lockfile refresh · upgrade parent · override · pin SHA · remove · replace · block · escalate · accept&lt;br&gt;each with risk reduction, compatibility, rollback&lt;/div&gt;
&lt;div class=&quot;box human&quot; style=&quot;left:978px;top:310px;width:270px;height:186px&quot;&gt;&lt;b&gt;Human approval &lt;span class=&quot;tag&quot; style=&quot;background:#b3261e&quot;&gt;GATE&lt;/span&gt;&lt;/b&gt;A named person approves, rejects or accepts each risk with a written reason (+ review date for accepted risk).&lt;br&gt;&lt;br&gt;The approved option is hash-locked: if the plan changes afterwards, the Validator refuses to apply it.&lt;/div&gt;

&lt;div class=&quot;box agent&quot; style=&quot;left:1288px;top:140px;width:270px;height:130px&quot;&gt;&lt;b&gt;5 · Validator&lt;/b&gt;Isolated clone + new branch · apply fix · regenerate lockfile · build · unit + integration tests before vs after · rescan · before/after SBOM · new-vuln check&lt;/div&gt;
&lt;div class=&quot;box agent&quot; style=&quot;left:1288px;top:310px;width:270px;height:86px&quot;&gt;&lt;b&gt;Reporter&lt;/b&gt;Guardian report (HTML + JSON) · residual &amp;amp; accepted risk · final confidence · SARIF&lt;/div&gt;
&lt;div class=&quot;box human&quot; style=&quot;left:1288px;top:416px;width:270px;height:80px&quot;&gt;&lt;b&gt;Human review &amp;amp; merge&lt;/b&gt;Branch + evidence handed over; Guardian never pushes, merges or deploys&lt;/div&gt;

&lt;div class=&quot;lbl&quot; style=&quot;left:48px;top:516px&quot;&gt;data sources (read-only)&lt;/div&gt;
&lt;div class=&quot;box data&quot; style=&quot;left:48px;top:550px;width:180px;height:110px&quot;&gt;&lt;b&gt;Vulnerability DBs&lt;/b&gt;OSV.dev · GitHub Advisory DB · offline snapshot&lt;/div&gt;
&lt;div class=&quot;box data&quot; style=&quot;left:243px;top:550px;width:190px;height:110px&quot;&gt;&lt;b&gt;npm registry&lt;/b&gt;versions · hashes · publish dates · attestations · take-downs&lt;/div&gt;
&lt;div class=&quot;box data&quot; style=&quot;left:448px;top:550px;width:180px;height:110px&quot;&gt;&lt;b&gt;GitHub&lt;/b&gt;git ls-remote: action ref → commit SHA&lt;/div&gt;

&lt;div class=&quot;lbl&quot; style=&quot;left:818px;top:522px&quot;&gt;ai (optional, pluggable)&lt;/div&gt;
&lt;div class=&quot;box ai&quot; style=&quot;left:668px;top:550px;width:270px;height:110px&quot;&gt;&lt;b&gt;Guardrails &lt;span class=&quot;tag&quot; style=&quot;background:#c08b00&quot;&gt;AI&lt;/span&gt;&lt;/b&gt;JSON schema · cited evidence must exist · no new CVE / version / URL strings · priority moves ±1 level max · rejected → deterministic fallback&lt;/div&gt;
&lt;div class=&quot;box ai&quot; style=&quot;left:978px;top:550px;width:270px;height:110px&quot;&gt;&lt;b&gt;LLM &lt;span class=&quot;tag&quot; style=&quot;background:#c08b00&quot;&gt;AI&lt;/span&gt;&lt;/b&gt;Claude API or local model (Ollama). Sees evidence JSON only: no source code, no secrets. Temperature 0, cached, prompts versioned by hash.&lt;/div&gt;
&lt;div class=&quot;box data&quot; style=&quot;left:1288px;top:550px;width:270px;height:110px&quot;&gt;&lt;b&gt;Policy-as-code&lt;/b&gt;&lt;code&gt;policies/*.json&lt;/code&gt;: block malicious / tampered components, risk budget (no open P1 in prod), pinned CI actions. Exit code gates CI.&lt;/div&gt;

&lt;div class=&quot;box store&quot; style=&quot;left:48px;top:700px;width:1510px;height:92px&quot;&gt;&lt;b&gt;Evidence store: one run directory per scan&lt;/b&gt;
sbom.cdx.json · dependency-graph.json / .html · findings.json / .sarif · analysis.json · investigation-*.json / .md · plan.json / .md · work/before + work/after (isolated clones) · after-scan/ · validation.json · guardian-report.html / .json&lt;br&gt;
&lt;b style=&quot;display:inline;font-size:12px&quot;&gt;audit.jsonl&lt;/b&gt;: append-only, SHA-256 hash-chained log of every step: actor (guardian / ai:model / human:name), action, input hashes, decisions. &lt;code&gt;guardian audit&lt;/code&gt; detects any edited or deleted entry.&lt;/div&gt;

&lt;h1&gt;Software Supply Chain Guardian: pipeline&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;All five stages run end-to-end on &lt;b&gt;Geshna-B/juice-shop @ hackathon-base (d6157d3)&lt;/b&gt;, with a human approval gate before any change.&lt;/div&gt;
&lt;div class=&quot;lbl&quot; style=&quot;left:300px&quot;&gt;◀ DAY 1: SEE ▶&lt;/div&gt;&lt;div class=&quot;lbl&quot; style=&quot;left:1010px;color:#b3261e&quot;&gt;◀ DAY 2: THINK · DECIDE · PROVE ▶&lt;/div&gt;
&lt;div class=&quot;row&quot;&gt;
 &lt;div class=&quot;stage&quot; style=&quot;border-top-color:#5b6573&quot;&gt;&lt;span class=&quot;tag todo&quot;&gt;input&lt;/span&gt;&lt;h3&gt;Repository&lt;/h3&gt;
  &lt;ul&gt;&lt;li&gt;package-lock.json&lt;/li&gt;&lt;li&gt;frontend/package-lock.json&lt;/li&gt;&lt;li&gt;3 Dockerfiles, 2 compose files&lt;/li&gt;&lt;li&gt;16 GitHub Actions workflows&lt;/li&gt;&lt;li&gt;optional: image SBOM (syft)&lt;/li&gt;&lt;/ul&gt;
  &lt;div class=&quot;out&quot;&gt;git commit pinned in provenance&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;arrow&quot;&gt;➜&lt;/div&gt;
 &lt;div class=&quot;stage mine&quot;&gt;&lt;span class=&quot;tag done&quot;&gt;done&lt;/span&gt;&lt;h3&gt;1 · Discover&lt;/h3&gt;
  &lt;ul&gt;&lt;li&gt;Parse npm lockfiles v1–v3 (real node_modules resolution)&lt;/li&gt;&lt;li&gt;Maven / Python manifests&lt;/li&gt;&lt;li&gt;Base images + CI actions as components&lt;/li&gt;&lt;li&gt;Build dependency graph + paths&lt;/li&gt;&lt;li&gt;Import CycloneDX / SPDX&lt;/li&gt;&lt;/ul&gt;
  &lt;div class=&quot;out&quot;&gt;sbom.cdx.json&lt;br&gt;dependency-graph.json&lt;br&gt;provenance.json&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;arrow&quot;&gt;➜&lt;/div&gt;
 &lt;div class=&quot;stage mine&quot;&gt;&lt;span class=&quot;tag done&quot;&gt;done&lt;/span&gt;&lt;h3&gt;2 · Detect&lt;/h3&gt;
  &lt;ul&gt;&lt;li&gt;Known CVEs + malicious packages&lt;/li&gt;&lt;li&gt;Typosquats&lt;/li&gt;&lt;li&gt;Unexpected / orphan deps&lt;/li&gt;&lt;li&gt;Unsafe install scripts&lt;/li&gt;&lt;li&gt;Untrusted images · CI/CD pinning&lt;/li&gt;&lt;li&gt;Lockfile tampering vs baseline + registry&lt;/li&gt;&lt;/ul&gt;
  &lt;div class=&quot;out&quot;&gt;findings.json · SARIF&lt;br&gt;report.html · risk-graph.svg&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;arrow&quot;&gt;➜&lt;/div&gt;
 &lt;div class=&quot;stage mine&quot;&gt;&lt;span class=&quot;tag done&quot;&gt;done&lt;/span&gt;&lt;h3&gt;3 · Analyze&lt;/h3&gt;
  &lt;ul&gt;&lt;li&gt;Reachability (import scan)&lt;/li&gt;&lt;li&gt;Exposure + prod use&lt;/li&gt;&lt;li&gt;Explainable score + confidence&lt;/li&gt;&lt;li&gt;AI explains, behind guardrails&lt;/li&gt;&lt;li&gt;Investigate a non-CVE risk&lt;/li&gt;&lt;/ul&gt;
  &lt;div class=&quot;out&quot;&gt;analysis.json&lt;br&gt;investigation-*.md&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;arrow&quot;&gt;➜&lt;/div&gt;
 &lt;div class=&quot;stage mine&quot;&gt;&lt;span class=&quot;tag done&quot;&gt;done&lt;/span&gt;&lt;h3&gt;4 · Remediate&lt;/h3&gt;
  &lt;ul&gt;&lt;li&gt;Upgrade / override / pin / remove / block&lt;/li&gt;&lt;li&gt;Risk reduction + compatibility&lt;/li&gt;&lt;li&gt;Rollback per option&lt;/li&gt;&lt;li&gt;&lt;b&gt;Named human approval&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;
  &lt;div class=&quot;out&quot;&gt;plan.json · audit.jsonl&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;arrow&quot;&gt;➜&lt;/div&gt;

  &lt;ul&gt;&lt;li&gt;Isolated branch, apply fix&lt;/li&gt;&lt;li&gt;Build + unit + integration tests&lt;/li&gt;&lt;li&gt;Rescan, before/after SBOM&lt;/li&gt;&lt;li&gt;New-vuln check · report&lt;/li&gt;&lt;/ul&gt;
  &lt;div class=&quot;out&quot;&gt;validation.json&lt;br&gt;guardian-report.html&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h1&gt;Day 2: prioritise with context, investigate with evidence&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;680 source files scanned for imports · Dockerfile shows the server is network-facing (EXPOSE 3000) · scope separates production from dev tooling&lt;/div&gt;
&lt;div class=&quot;cols&quot;&gt;
 &lt;div class=&quot;col&quot; style=&quot;flex:1.05&quot;&gt;&lt;h3&gt;Explainable risk score: crypto-js@3.3.0 (via pdfkit)&lt;/h3&gt;
  &lt;table&gt;
   &lt;tr&gt;&lt;td class=&quot;pts&quot;&gt;91&lt;/td&gt;&lt;td&gt;&lt;b&gt;Severity&lt;/b&gt;: CVSS 9.1&lt;/td&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td class=&quot;pts&quot;&gt;+5&lt;/td&gt;&lt;td&gt;&lt;b&gt;Exploitability&lt;/b&gt;: network, no credentials, no user action&lt;/td&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td class=&quot;pts&quot;&gt;+5&lt;/td&gt;&lt;td&gt;&lt;b&gt;Reachability&lt;/b&gt;: &lt;code&gt;pdfkit&lt;/code&gt; is imported by &lt;code&gt;routes/order.ts&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td class=&quot;pts&quot;&gt;+10&lt;/td&gt;&lt;td&gt;&lt;b&gt;Exposure&lt;/b&gt;: runs in the network-facing server&lt;/td&gt;&lt;/tr&gt;
   &lt;tr class=&quot;tot&quot;&gt;&lt;td class=&quot;pts&quot; style=&quot;color:#b3261e&quot;&gt;100&lt;/td&gt;&lt;td&gt;(111, capped at 100) &lt;span class=&quot;p&quot; style=&quot;background:#b3261e&quot;&gt;P1-urgent&lt;/span&gt; &amp;nbsp;confidence &lt;b style=&quot;display:inline&quot;&gt;0.85&lt;/b&gt; (version match; function use not proven)&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;
  &lt;div class=&quot;cmp&quot;&gt;
   &lt;div&gt;&lt;b&gt;83 · P1&lt;/b&gt;tar@6.2.1&lt;br&gt;parent sqlite3 loaded dynamically → reachability &lt;i&gt;unknown&lt;/i&gt;, confidence 0.75&lt;/div&gt;
   &lt;div&gt;&lt;b&gt;30 · P4&lt;/b&gt;@cyclonedx/cyclonedx-npm&lt;br&gt;dev-only tooling, not shipped → −30&lt;/div&gt;
   &lt;div&gt;&lt;b&gt;26 / 22 / 12 / 29&lt;/b&gt;P1 / P2 / P3 / P4&lt;br&gt;89 findings ranked by context&lt;/div&gt;
  &lt;/div&gt;
  &lt;p style=&quot;font-size:13px;color:#5b6573;margin-top:12px&quot;&gt;AI (Claude, Gemini, Groq or a local Ollama model) may explain a finding and suggest moving it ±1 level. It sees evidence JSON only. Answers citing unknown evidence or inventing CVEs or versions are rejected and replaced by a deterministic explanation.&lt;/p&gt;
 &lt;/div&gt;
 &lt;div class=&quot;col&quot; style=&quot;flex:1&quot;&gt;&lt;h3&gt;Investigation of a non-CVE risk: &lt;code style=&quot;font-size:15px&quot;&gt;calibreapp/image-actions@main&lt;/code&gt;&lt;/h3&gt;
  &lt;div class=&quot;ver&quot;&gt;&lt;b&gt;✅ Verified evidence (deterministic)&lt;/b&gt;
   F1 workflow &lt;code&gt;image_actions.yml:33&lt;/code&gt; uses &lt;code&gt;@main&lt;/code&gt;&lt;br&gt;
   F2 &lt;code&gt;git ls-remote&lt;/code&gt;: &lt;code&gt;main&lt;/code&gt; currently = commit &lt;code&gt;cfe6ba91…&lt;/code&gt;, branch moves on every push&lt;br&gt;
   F3 no commit-SHA pin: CI runs whatever &lt;code&gt;main&lt;/code&gt; points to&lt;br&gt;
   F4 git history of the workflow file&lt;/div&gt;
  &lt;div class=&quot;inf&quot;&gt;&lt;b&gt;🤖 Inference (labelled, cites F1–F4)&lt;/b&gt;
   Verdict: &lt;b style=&quot;display:inline&quot;&gt;suspicious&lt;/b&gt;. A compromise of that repository would run in this CI with its token.&lt;br&gt;
   Next: pin to the reviewed SHA · block until reviewed · escalate&lt;/div&gt;
  &lt;div class=&quot;ver&quot; style=&quot;margin-top:10px&quot;&gt;&lt;b&gt;Demo app: typosquat &lt;code&gt;crossenv&lt;/code&gt; → likely-malicious&lt;/b&gt;
   new vs baseline · look-alike of &lt;code&gt;cross-env&lt;/code&gt; · postinstall sends &lt;code&gt;process.env&lt;/code&gt; to a remote host · npm security take-down&lt;/div&gt;

&lt;h1&gt;Final demo: from detection to verified remediation&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;Juice Shop @ d6157d3 · one approved dependency fix + one CI pin · everything below comes from the actual run&lt;/div&gt;
&lt;div class=&quot;flow&quot;&gt;
 &lt;div class=&quot;st&quot;&gt;&lt;h3&gt;1 Prioritised risk&lt;/h3&gt;crypto-js@3.3.0&lt;br&gt;2 advisories, CVSS 9.1&lt;br&gt;score 100 · P1 · reachable via &lt;code&gt;pdfkit&lt;/code&gt; in &lt;code&gt;routes/order.ts&lt;/code&gt;&lt;/div&gt;&lt;div class=&quot;ar&quot;&gt;➜&lt;/div&gt;
