[project]
name = "supply-chain-guardian"
version = "0.1.0"
description = "Agentic software supply chain guardian: discover, detect, explain (Bosch BGSW hackathon)"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.6.1",
    "pyvis>=0.3.2",
    "pyyaml>=6",
    "streamlit>=1.67.0",
]

[project.scripts]
guardian = "guardian.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardian"]
